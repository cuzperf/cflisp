# prepare (may need python venv)

# pip install mkdocs mkdocs-bootswatch pymdown-extensions
# pip install mkdocs-material mkdocs-rss-plugin python-markdown-math
# pip install mkdocs-encryptcontent-plugin

# Linux/macOS
# PYTHONPATH="${PYTHONPATH}:$(pwd)/docs" mkdocs serve
# PYTHONPATH="${PYTHONPATH}:$(pwd)/docs" mkdocs gh-deploy

# Windows CMD
# set PYTHONPATH=%PYTHONPATH%;%CD%\docs && mkdocs serve
# set PYTHONPATH=%PYTHONPATH%;%CD%\docs && mkdocs gh-deploy

site_name: cflisp docs
site_author: 'cuzperf'
site_url: 'https://cuzperf.github.io/cflisp'

repo_name: cuzperf/cflisp
repo_url: https://github.com/cuzperf/cflisp

copyright: Copyright © 2026 cuzperf

# Contents
nav:
  - 主页: index.md
  - 参考手册: reference.md
  - 处理流程图: dataFlow.md
  - 设计文档: design.md
  - 实现文档: implementation.md
  - 杂项:
    - 问答: QA.md
    - 拟引用: qusiquote.md

theme:
  name: material
  language: zh
  custom_dir: docs/theme
  highlightjs: true
  icon:
    repo: fontawesome/brands/git-alt
  logo: img/favicon.ico
  favicon: img/cuzperf.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: deep purple
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.expand
    - search.suggest
    - search.highlight
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cuzperf/cflisp
    - icon: fontawesome/solid/rss
      link: feed_rss_updated.xml

markdown_extensions:
  - chinese_bold
  - admonition
  - footnotes
  - meta
  - mdx_math:
      enable_dollar_delimiter: True
  # - pymdownx.arithmatex
  # - pymdownx.arithmatex:
      # generic: true
  - pymdownx.caret
  - pymdownx.tabbed
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.inlinehilite:
      custom_inline:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.inline_mathjax_format
  - codehilite:
      guess_lang: false
      linenums: true
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
#  - pymdownx.emoji:
#      emoji_generator: !!python/name:pymdownx.emoji.to_svg
#  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true


extra_javascript:
# mathjax2（mathjax3 有 bug）:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML'

extra_css:
  - https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css

plugins:
  - search
  - rss
